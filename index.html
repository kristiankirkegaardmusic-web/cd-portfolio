<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive CD Portfolio - Kristian Kirkegaard Music">
    <title>CD Portfolio - Kristian Kirkegaard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/modal.css">
</head>
<body>
    <div class="container">
        <canvas id="canvas"></canvas>
        <div class="instruction">Hover to pull • Click to open</div>
    </div>

    <div id="cdModal" class="modal">
        <button class="close-btn">BACK</button>
        <div class="modal-content">
            <div class="modal-left">
                <img id="modalImage" src="" alt="Project Image">
            </div>
            <div class="modal-right">
                <div class="artist-name" id="modalArtist">Artist</div>
                <h2 id="modalTitle">Project Title</h2>
                <p id="modalDescription">Project description goes here...</p>
                
                <div class="video-container" id="videoContainer" style="display: none;">
                    <iframe id="videoFrame" allowfullscreen></iframe>
                </div>

                <div class="image-gallery" id="imageGallery"></div>

                <div class="wall-limit">
                    <div class="lock-icon">🔒</div>
                    <span>Wall limit</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/cd.js"></script>
    <script src="js/scene.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
